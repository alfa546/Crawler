<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Page Speed — Crawler</title>
  <link rel="icon" type="image/png" href="/static/logo.png?refresh=4">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css?v={{ v }}">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="/static/logo.png?refresh=4" alt="Crawler Logo">
      <span>Crawler</span>
    </div>
    <div class="sub">Core Web Vitals · Google Lighthouse</div>
    <nav class="sc-views">
      <a href="/" class="sc-view-btn" style="text-decoration:none;">Crawler</a>
      <span class="sc-view-btn active">Page Speed ⚡</span>
    </nav>
    <button type="button" class="theme-toggle" id="theme-toggle-btn" onclick="toggleTheme()" title="Toggle light / dark theme">
      <svg id="theme-toggle-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
      </svg>
      <span id="theme-toggle-label">Light</span>
    </button>
  </header>
  <script>
    (function() {
      const saved = localStorage.getItem('sc_theme');
      const sysDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const theme = saved || (sysDark ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    })();
    function toggleTheme() {
      const cur = document.documentElement.getAttribute('data-theme') || 'light';
      const next = cur === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('sc_theme', next);
      const lbl = document.getElementById('theme-toggle-label');
      if (lbl) lbl.textContent = next === 'dark' ? 'Light' : 'Dark';
      const icon = document.getElementById('theme-toggle-icon');
      if (icon) icon.innerHTML = next === 'dark'
        ? '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>'
        : '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
    }
    window.addEventListener('DOMContentLoaded', function() {
      const cur = document.documentElement.getAttribute('data-theme') || 'light';
      const lbl = document.getElementById('theme-toggle-label');
      if (lbl) lbl.textContent = cur === 'dark' ? 'Light' : 'Dark';
      const icon = document.getElementById('theme-toggle-icon');
      if (icon && cur === 'light') icon.innerHTML = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
    });
  </script>

  <main style="max-width:900px;margin:28px auto;padding:0 18px;">
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px;">
      <input type="url" id="cwv-url-input" placeholder="Paste any URL — e.g. https://example.com" style="flex:1;min-width:260px;padding:10px 14px;font-size:13.5px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text);" onkeydown="if(event.key==='Enter')runCwvScan()">
      <select id="cwv-strategy" style="padding:10px;font-size:13px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text);cursor:pointer;">
        <option value="mobile">Mobile</option>
        <option value="desktop">Desktop</option>
      </select>
      <button type="button" id="cwv-run-btn" onclick="runCwvScan()" style="padding:10px 22px;background:var(--accent);color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;">Run test</button>
    </div>
    <div style="font-size:11px;color:var(--text-muted);margin-bottom:18px;">Runs the same engine as Google PageSpeed Insights — one real Lighthouse audit (~30s). Results below are official lab metrics, not estimates.</div>
    <div id="cwv-results" style="font-size:13px;color:var(--text);"></div>
  </main>

  <script src="/static/script.js?v={{ v }}"></script>
  <script>
    // Show empty state on load
    document.addEventListener('DOMContentLoaded', function() {
      const res = document.getElementById('cwv-results');
      if (res && !res.innerHTML && typeof _cwvEmptyState === 'function') res.innerHTML = _cwvEmptyState();
    });
  </script>
</body>
</html>
